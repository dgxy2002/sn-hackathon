<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title description">
  <title id="title">Synthetic critical illness policy schedule</title>
  <description id="description">A fictional one-page critical illness schedule for extraction evaluation.</description>
  <rect width="1200" height="1600" fill="#f7f7f2"/>
  <rect x="54" y="54" width="1092" height="1492" fill="#ffffff" stroke="#121416" stroke-width="2"/>
  <rect x="54" y="54" width="1092" height="116" fill="#121416"/>
  <text x="92" y="126" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="700">SYNTHETIC POLICY SCHEDULE</text>
  <text x="92" y="242" fill="#62686c" font-family="monospace" font-size="18">INSURER</text>
  <text x="92" y="278" fill="#121416" font-family="sans-serif" font-size="26">Harbour Mutual</text>
  <text x="630" y="242" fill="#62686c" font-family="monospace" font-size="18">REFERENCE</text>
  <text x="630" y="278" fill="#121416" font-family="sans-serif" font-size="26">SYN-HCC-2026-001</text>
  <line x1="92" y1="316" x2="1050" y2="316" stroke="#afb4ad"/>
  <text x="92" y="364" fill="#62686c" font-family="monospace" font-size="18">PLAN NAME</text>
  <text x="92" y="402" fill="#121416" font-family="sans-serif" font-size="28">Critical Care 30</text>
  <text x="630" y="364" fill="#62686c" font-family="monospace" font-size="18">POLICY TYPE</text>
  <text x="630" y="402" fill="#121416" font-family="sans-serif" font-size="28">Critical illness</text>
  <rect x="92" y="520" width="470" height="240" fill="#eff0ea"/>
  <rect x="630" y="520" width="420" height="240" fill="#dff6e9"/>
  <text x="120" y="574" fill="#62686c" font-family="monospace" font-size="18">PREMIUM</text>
  <text x="120" y="634" fill="#121416" font-family="sans-serif" font-size="38" font-weight="700">S$720</text>
  <text x="120" y="708" fill="#121416" font-family="sans-serif" font-size="24">Annual</text>
  <text x="658" y="574" fill="#17623b" font-family="monospace" font-size="18">CI BENEFIT</text>
  <text x="658" y="634" fill="#121416" font-family="sans-serif" font-size="38" font-weight="700">S$50,000</text>
