  <text x="120" y="1054" fill="#121416" font-family="sans-serif" font-size="20">Early-stage illness is not covered in this synthetic fixture.</text>
  <rect x="92" y="1340" width="958" height="112" fill="#fff0d9"/>
  <text x="120" y="1390" fill="#8a5000" font-family="monospace" font-size="17">TEST ARTIFACT ONLY</text>
  <text x="120" y="1426" fill="#121416" font-family="sans-serif" font-size="20">Not an insurer document. Not valid coverage or financial advice.</text>
