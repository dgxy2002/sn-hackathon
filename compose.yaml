name: covercheck

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local-compose
      EVIDENCE_MODE: ${EVIDENCE_MODE:-synthetic}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      BEDROCK_EMBEDDING_DIMENSIONS: ${BEDROCK_EMBEDDING_DIMENSIONS:-1024}
      EVIDENCE_MAX_AGE_DAYS: "365"
      DEPENDENCY_TIMEOUT_SECONDS: "20"
      PROFILE_MODE: synthetic
      EXTRACTION_MODE: simulated
      RECOMMENDATION_MODE: simulated
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-simulated}
      CONVERSATION_MODE: ${CONVERSATION_MODE:-simulated}
      LLM_PROVIDER: bedrock
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_URL: postgresql://covercheck:${POSTGRES_PASSWORD:-covercheck-local-only}@postgres:5432/covercheck
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.scraper_worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://covercheck:${POSTGRES_PASSWORD:-covercheck-local-only}@postgres:5432/covercheck
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-86400}
      SCRAPE_LEASE_TTL_SECONDS: ${SCRAPE_LEASE_TTL_SECONDS:-900}
      SCRAPE_SOURCE_ALLOWLIST: ${SCRAPE_SOURCE_ALLOWLIST:-}
      SCRAPE_TIMEOUT_SECONDS: ${SCRAPE_TIMEOUT_SECONDS:-20}
      SCRAPE_DELAY_SECONDS: ${SCRAPE_DELAY_SECONDS:-1}
      SCRAPE_MAX_RETRIES: ${SCRAPE_MAX_RETRIES:-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, psycopg; connection=psycopg.connect(os.environ['DATABASE_URL']); count=connection.execute(\"SELECT count(*) FROM scraper_runtime WHERE worker_name='continuous-scraper' AND state IN ('running','degraded') AND last_heartbeat > now() - interval '2 minutes'\").fetchone()[0]; connection.close(); raise SystemExit(0 if count == 1 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-covercheck}
      POSTGRES_USER: ${POSTGRES_USER:-covercheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-covercheck-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
