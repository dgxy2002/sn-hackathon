services:
  web:
    build:
      secrets:
        - corporate_ca

  backend:
    build:
      secrets:
        - corporate_ca

  scraper:
    build:
      secrets:
        - corporate_ca

secrets:
  corporate_ca:
    file: ${CORPORATE_CA_CERT_PATH:?Set CORPORATE_CA_CERT_PATH to a PEM or CRT CA bundle}